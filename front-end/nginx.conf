server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the paths (/top, /random); always fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|ico|svg|json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
