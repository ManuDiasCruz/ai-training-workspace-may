name: Validate application

on:
  push:
    branches: [731-deh-singmeasong]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sing_me_a_song_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/sing_me_a_song_test?schema=public
      MODE: TEST
      NODE_ENV: test
      PORT: 5000
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            back-end/package-lock.json
            front-end/package-lock.json
      - name: Install and build API
        working-directory: back-end
        run: npm ci && npm run build
      - name: Migrate test database
        working-directory: back-end
        run: npm run db:migrate:deploy
      - name: Run API tests
        working-directory: back-end
        run: npm run test:unit && npm run test:integration
      - name: Install and build frontend
        working-directory: front-end
        run: npm ci && npm run build
      - name: Start application for browser tests
        run: |
          (cd back-end && npm start > "$RUNNER_TEMP/api.log" 2>&1) &
          (cd front-end && BROWSER=none REACT_APP_API_BASE_URL=http://localhost:5000 npm start > "$RUNNER_TEMP/web.log" 2>&1) &
          for attempt in {1..60}; do
            if curl -fsS http://localhost:5000/health >/dev/null && curl -fsS http://localhost:3000 >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "Application did not become ready"
          exit 1
      - name: Run browser flows
        working-directory: front-end
        run: npm run test:e2e
      - name: Print server logs on failure
        if: failure()
        run: |
          test ! -f "$RUNNER_TEMP/api.log" || cat "$RUNNER_TEMP/api.log"
          test ! -f "$RUNNER_TEMP/web.log" || cat "$RUNNER_TEMP/web.log"
