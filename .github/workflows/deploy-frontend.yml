name: Deploy front-end to GitHub Pages

on:
  push:
    branches: [0827-feh-singasong]
    paths: [front-end/**, .github/workflows/deploy-frontend.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: "0"
      - name: Build
        run: npm run build
        env:
          CI: "true"
          # The site is served from https://<owner>.github.io/<repo>/
          PUBLIC_URL: /${{ github.event.repository.name }}
          # Repository variable (Settings -> Secrets and variables -> Actions -> Variables)
          REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL }}
      - name: SPA fallback for client-side routes (/top, /random)
        run: cp build/index.html build/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: front-end/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
