name: sing-me-a-song CI

on:
  push:
    branches: [723-oeh-singmeasong]
  pull_request:
    branches: [main]
    paths:
      - "back-end/**"
      - "front-end/**"
      - ".github/workflows/sing-me-a-song-ci.yml"
  workflow_dispatch:

jobs:
  back-end:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: singmeasong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: back-end

    env:
      # Throw-away credentials for the ephemeral CI database only.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/singmeasong_test?schema=public
      MODE: TEST

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      # The npm scripts read .env.test through dotenv-cli; in CI the values
      # already live in the job environment, so jest is invoked directly.
      - run: npx cross-env NODE_OPTIONS=--experimental-vm-modules npx jest -i

  front-end:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front-end

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - run: npm ci
      - run: npm run build
        env:
          CI: true
