databases:
  - name: sing-me-a-song-db
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: sing-me-a-song
    runtime: node
    plan: free
    region: oregon
    branch: 731-deh-singmeasong
    autoDeployTrigger: commit
    buildCommand: cd front-end && npm ci && npm run build && cd ../back-end && npm ci && npm run build
    # Free web services do not support pre-deploy commands. Migrations are safe to
    # apply at startup for this single-instance preview. Use preDeployCommand on a paid plan.
    startCommand: cd back-end && npm run db:migrate:deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sing-me-a-song-db
          property: connectionString
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: CYPRESS_INSTALL_BINARY
        value: "0"
