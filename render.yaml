services:
  - type: web
    name: sing-me-a-song-cy-eh
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --prefix back-end && npm ci --prefix front-end && npm run build && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sing-me-a-song-cy-eh-db
          property: connectionString
      - key: NODE_VERSION
        value: 22.22.0
      - key: SKIP_INSTALL_DEPS
        value: "true"

databases:
  - name: sing-me-a-song-cy-eh-db
    plan: free
    region: virginia
    databaseName: sing_me_a_song
    user: sing_me_a_song
    postgresMajorVersion: "16"
    ipAllowList: []
