# Render Blueprint for sing-me-a-song.
#
# Deploy with: Render dashboard -> New -> Blueprint -> pick this repository and
# the 0827-oeh-singasong branch. Render reads this file and creates all three
# resources, wiring DATABASE_URL and REACT_APP_API_BASE_URL automatically.
#
# No secrets live in this file: the database credentials are generated by Render
# and injected through fromDatabase/fromService references.

databases:
  - name: singmeasong-db
    databaseName: singmeasong
    user: singmeasong
    plan: free

services:
  # Express + Prisma API.
  - type: web
    name: singmeasong-api
    runtime: node
    plan: free
    rootDir: back-end
    # migrate deploy runs here because DATABASE_URL is already available during
    # the build, and it is idempotent, so redeploys are safe.
    buildCommand: npm ci && npm run build && npx prisma migrate deploy
    startCommand: npm start
    # Returns 200 with an empty array on a fresh database.
    healthCheckPath: /recommendations
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: singmeasong-db
          property: connectionString
      # MODE is deliberately unset: MODE=TEST would expose /tests/reset and
      # /tests/seed, which can wipe the database.

  # Create React App static bundle.
  - type: web
    name: singmeasong-web
    runtime: static
    rootDir: front-end
    # CRA inlines REACT_APP_* at build time, so the API host has to be known
    # here rather than at runtime.
    buildCommand: npm ci && REACT_APP_API_BASE_URL="https://$API_HOST" npm run build
    staticPublishPath: build
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: API_HOST
        fromService:
          name: singmeasong-api
          type: web
          property: host
    routes:
      # Client-side routing: /top and /random must fall through to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
