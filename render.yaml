databases:
  - name: sing-me-a-song-db-0827
    plan: free
    databaseName: sing_me_a_song
    user: sing_me_a_song

services:
  - type: web
    name: sing-me-a-song-yahk2
    runtime: node
    plan: free
    buildCommand: npm --prefix back-end ci && npm --prefix back-end run build && npm --prefix front-end ci && npm --prefix front-end run build
    startCommand: npm --prefix back-end run db:migrate && npm --prefix back-end start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sing-me-a-song-db-0827
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: GENERATE_SOURCEMAP
        value: "false"
