services:
  - type: web
    name: sing-me-a-song-blue-api
    runtime: node
    plan: free
    branch: H2H-blue-sing
    buildCommand: cd back-end && npm ci && npm run build
    preDeployCommand: cd back-end && npm run db:migrate
    startCommand: cd back-end && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sing-me-a-song-blue-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: sing-me-a-song-blue
    runtime: static
    branch: H2H-blue-sing
    buildCommand: cd front-end && npm ci && npm run build
    staticPublishPath: ./front-end/build
    envVars:
      - key: REACT_APP_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: sing-me-a-song-blue-db
    plan: free
    databaseName: sing_me_a_song
    user: sing_me_a_song

