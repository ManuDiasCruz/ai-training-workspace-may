services:
  - type: web
    name: sing-me-a-song-red
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/ManuDiasCruz/ai-training-workspace-may
    branch: H2H-red-sing
    autoDeploy: true
    buildCommand: npm ci --prefix back-end && npm ci --prefix front-end && npm run build --prefix front-end && npm run build --prefix back-end
    startCommand: npm run db:migrate --prefix back-end && npm start --prefix back-end
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
