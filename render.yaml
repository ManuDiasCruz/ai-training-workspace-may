# One-click Render.com blueprint for the whole stack.
# Render dashboard -> New -> Blueprint -> point it at this repository/branch.
# After the first deploy, set the frontend's REACT_APP_API_BASE_URL to the
# public URL Render assigned to sing-me-a-song-api and trigger a rebuild.
services:
  - type: web
    name: sing-me-a-song-api
    runtime: node
    rootDir: back-end
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sing-me-a-song-db
          property: connectionString
      - key: MODE
        value: PROD

  - type: web
    name: sing-me-a-song-front
    runtime: static
    rootDir: front-end
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://sing-me-a-song-api.onrender.com

databases:
  - name: sing-me-a-song-db
    plan: free
    databaseName: sing_me_a_song
