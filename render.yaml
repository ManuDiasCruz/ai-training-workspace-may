# Render Blueprint — provisions PostgreSQL + API + static front-end.
# In Render: New + -> Blueprint -> point it at this repository and the
# fb-ehe-sing-me-a-song branch, review the plan and apply.
#
# NOTE: Create React App bakes REACT_APP_API_BASE_URL in at build time. The
# value below assumes the API service keeps the name singmeasong-fb-api; if
# Render assigns a different URL, update the env var and redeploy the
# front-end.
databases:
  - name: singmeasong-fb-db
    plan: free
    databaseName: singmeasong
    user: singmeasong

services:
  - type: web
    name: singmeasong-fb-api
    runtime: node
    plan: free
    branch: fb-ehe-sing-me-a-song
    rootDir: back-end
    buildCommand: npm ci && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: singmeasong-fb-db
          property: connectionString
      - key: NODE_VERSION
        value: "20.18.0"

  - type: web
    name: singmeasong-fb-web
    runtime: static
    branch: fb-ehe-sing-me-a-song
    rootDir: front-end
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://singmeasong-fb-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
