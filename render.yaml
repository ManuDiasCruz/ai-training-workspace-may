databases:
  - name: sing-me-a-song-db
    databaseName: sing_me_a_song
    user: sing_me_a_song

services:
  - type: web
    name: sing-me-a-song-api
    env: node
    rootDir: back-end
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run deploy:start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: sing-me-a-song-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: MODE
        value: PRODUCTION

  - type: web
    name: sing-me-a-song-web
    env: static
    rootDir: front-end
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        sync: false
