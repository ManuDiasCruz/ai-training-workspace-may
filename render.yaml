# Reuse the authorized Render PostgreSQL instance without managing its lifecycle.
# The hosted launcher isolates this app's migrations and tables in DATABASE_SCHEMA.
services:
  - type: web
    name: singasong-0827-ben
    runtime: node
    plan: free
    branch: 0827-ben-singasong
    rootDir: sing-me-a-song
    buildCommand: npm ci --include=dev --prefix back-end && npm ci --include=dev --prefix front-end && npm run build
    startCommand: node back-end/scripts/start-hosted.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ENABLE_TEST_ROUTES
        value: "false"
      - key: CYPRESS_INSTALL_BINARY
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: beeh-sing-me-a-song-db
          property: connectionString
      - key: DATABASE_SCHEMA
        value: singasong_0827_ben
