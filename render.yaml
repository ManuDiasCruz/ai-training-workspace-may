# Render.com Blueprint (https://render.com/docs/blueprint-spec)
# One-click full-stack deploy: managed PostgreSQL + Node API + static front-end.
#
# In the Render dashboard: New > Blueprint > point at this repo/branch.
# After the API is live, confirm the front-end's REACT_APP_API_BASE_URL below
# matches the API service URL Render assigns (https://singmeasong-api.onrender.com).

databases:
  - name: singmeasong-db
    databaseName: singmeasong
    plan: free

services:
  # ---- Back-end API ----
  - type: web
    name: singmeasong-api
    runtime: node
    plan: free
    rootDir: back-end
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /recommendations
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: singmeasong-db
          property: connectionString
      # Render injects PORT automatically; the server honours process.env.PORT.

  # ---- Front-end (static site) ----
  - type: web
    name: singmeasong-web
    runtime: static
    rootDir: front-end
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://singmeasong-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
