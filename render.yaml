databases:
  - name: singmeasong-db
    plan: free
    databaseName: singmeasong
    user: singmeasong

services:
  - type: web
    name: singmeasong-api
    runtime: node
    plan: free
    rootDir: back-end
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: singmeasong-db
          property: connectionString
      # Set CORS_ORIGIN to the static site's URL once it exists
      # - key: CORS_ORIGIN
      #   value: https://singmeasong-web.onrender.com

  - type: web
    name: singmeasong-web
    runtime: static
    rootDir: front-end
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      # SPA fallback: /top and /random only exist client-side
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Point this at the API service URL, then trigger a rebuild
      - key: REACT_APP_API_BASE_URL
        sync: false
