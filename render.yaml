services:
  - type: web
    name: sing-me-a-song
    runtime: node
    plan: free
    buildCommand: npm --prefix back-end install && npm --prefix front-end install && npm --prefix front-end run build && npm --prefix back-end run build
    preDeployCommand: npm --prefix back-end run migrate:deploy
    startCommand: npm --prefix back-end start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sing-me-a-song-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20

databases:
  - name: sing-me-a-song-db
    plan: free
    databaseName: sing_me_a_song
    user: sing_me_a_song
