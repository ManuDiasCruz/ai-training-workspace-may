services:
  - type: web
    name: sing-me-a-song-731
    runtime: node
    plan: free
    branch: 731-ceh-singmeasong
    buildCommand: npm run install:all && npm run build
    preDeployCommand: npm --prefix back-end run db:deploy
    startCommand: npm start
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sing-me-a-song-db-731
          property: connectionString
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: true

databases:
  - name: sing-me-a-song-db-731
    plan: free
    postgresMajorVersion: "16"
    databaseName: sing_me_a_song
    user: sing_me_a_song
    ipAllowList: []
