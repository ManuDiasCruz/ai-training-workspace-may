# Deploy this branch as one Node service plus a managed PostgreSQL database.
services:
  - type: web
    name: singasong-0827-ben
    runtime: node
    plan: free
    branch: 0827-ben-singasong
    rootDir: sing-me-a-song
    buildCommand: npm ci --include=dev --prefix back-end && npm ci --include=dev --prefix front-end && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ENABLE_TEST_ROUTES
        value: "false"
      - key: CYPRESS_INSTALL_BINARY
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: singasong-0827-db
          property: connectionString

databases:
  - name: singasong-0827-db
    plan: free
    databaseName: sing_me_a_song
    user: singasong
    postgresMajorVersion: "16"
