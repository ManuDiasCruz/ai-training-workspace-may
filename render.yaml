databases:
  - name: sing-me-a-song-kindle-db
    databaseName: sing_me_a_song
    user: sing_me_a_song
    plan: free

services:
  - type: web
    name: sing-me-a-song-kindle-api
    runtime: node
    rootDir: back-end
    plan: free
    buildCommand: npm ci && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: sing-me-a-song-kindle-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: MODE
        value: PRODUCTION

  - type: web
    name: sing-me-a-song-kindle-web
    runtime: static
    rootDir: front-end
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: REACT_APP_API_BASE_URL
        sync: false
