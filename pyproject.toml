[project]
name = "shopping-api"
version = "0.1.0"
description = "FastAPI service for exploring a shopping customer dataset."
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.112,<1.0",
    "starlette>=0.37,<0.39",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
