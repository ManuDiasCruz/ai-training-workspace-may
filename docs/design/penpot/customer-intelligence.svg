      <text x="104" y="803" class="body bold">0006</text><rect x="316" y="778" width="70" height="25" rx="13" fill="#FCE7F3"/><text x="329" y="795" class="caption" fill="#BE185D">Female</text><text x="482" y="803" class="body">22 years</text><text x="624" y="803" class="body">17 k$</text><rect x="856" y="787" width="64" height="7" rx="4" class="scorebg"/><rect x="856" y="787" width="49" height="7" rx="4" class="scorehigh"/><text x="935" y="803" class="body bold">76</text><text x="962" y="803" class="caption muted">High</text><text x="1310" y="803" class="body bold">•••</text>
