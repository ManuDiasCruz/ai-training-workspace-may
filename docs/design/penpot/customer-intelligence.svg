<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Shopping Customers — Customer Intelligence first page</title>
  <desc id="desc">Stakeholder: Mary. Desktop design reference with navigation, KPI cards, customer filters, and a customer data table.</desc>
  <style>
    text{font-family:Inter,Arial,sans-serif;fill:#132A2E}.muted{fill:#627579}.label{font-size:12px;font-weight:700}.eyebrow{fill:#0F766E;font-size:11px;font-weight:800;letter-spacing:1.2px}.body{font-size:14px}.caption{font-size:12px}.h1{font-size:28px;font-weight:700}.h2{font-size:20px;font-weight:700}.metric{font-size:30px;font-weight:700}.white{fill:#FFFFFF}.bold{font-weight:700}.line{stroke:#D9E4E3;stroke-width:1}.control{fill:#FFFFFF;stroke:#D9E4E3;stroke-width:1}.scorebg{fill:#E6EEED}.scorehigh{fill:#067647}.scoremid{fill:#B54708}
  </style>
  <rect width="1440" height="1024" fill="#F4F7F7"/>
  <g id="Navigation"><rect width="1440" height="64" fill="#16383E"/><rect x="80" y="15" width="34" height="34" rx="10" fill="#2DD4BF"/><text x="90" y="37" font-size="12" font-weight="800">SC</text><text x="126" y="38" class="white body bold">Shopping Customers</text><circle cx="1163" cy="32" r="4" fill="#34D399"/><text x="1175" y="37" class="white caption">API online</text><rect x="1262" y="14" width="98" height="36" rx="10" fill="none" stroke="#547176"/><text x="1280" y="37" class="white caption">API docs</text></g>
  <g id="Hero"><text x="80" y="111" class="eyebrow">CUSTOMER INTELLIGENCE</text><text x="80" y="145" class="h1">Understand the customers behind the numbers.</text><text x="80" y="171" class="body muted">Browse all 200 records, compare spending behavior, and manage this retail analytics dataset.</text><rect x="1212" y="112" width="148" height="44" rx="10" fill="#0F766E"/><text x="1236" y="140" class="white body bold">+ Add customer</text></g>
  <g id="KPI Cards"><g><rect x="80" y="204" width="308" height="136" rx="16" fill="#FFFFFF" stroke="#D9E4E3"/><rect x="80" y="204" width="308" height="3" rx="1.5" fill="#0F766E"/><text x="100" y="235" class="label muted">TOTAL CUSTOMERS</text><text x="100" y="283" class="metric">200</text><text x="100" y="312" class="caption" fill="#BE185D">112 Female</text><text x="174" y="312" class="caption muted">·</text><text x="184" y="312" class="caption" fill="#1D4ED8">88 Male</text></g><g><rect x="404" y="204" width="308" height="136" rx="16" fill="#FFFFFF" stroke="#D9E4E3"/><rect x="404" y="204" width="308" height="3" fill="#0F766E"/><text x="424" y="235" class="label muted">AVERAGE AGE</text><text x="424" y="283" class="metric">38.9</text><text x="424" y="312" class="caption muted">years</text></g><g><rect x="728" y="204" width="308" height="136" rx="16" fill="#FFFFFF" stroke="#D9E4E3"/><rect x="728" y="204" width="308" height="3" fill="#0F766E"/><text x="748" y="235" class="label muted">AVERAGE ANNUAL INCOME</text><text x="748" y="283" class="metric">60.6 k$</text><text x="748" y="312" class="caption muted">per customer</text></g><g><rect x="1052" y="204" width="308" height="136" rx="16" fill="#FFFFFF" stroke="#D9E4E3"/><rect x="1052" y="204" width="308" height="3" fill="#0F766E"/><text x="1072" y="235" class="label muted">AVERAGE SPENDING SCORE</text><text x="1072" y="283" class="metric">50.2</text><text x="1072" y="312" class="caption muted">of 100</text></g></g>
  <g id="Customer Directory"><rect x="80" y="364" width="1280" height="596" rx="16" fill="#FFFFFF" stroke="#D9E4E3"/><text x="104" y="398" class="eyebrow">DIRECTORY</text><text x="104" y="429" class="h2">Customers</text><text x="210" y="429" class="caption muted">200</text><rect x="1192" y="390" width="144" height="40" rx="10" class="control"/><text x="1208" y="415" class="caption" fill="#0F766E">Export current view</text>
