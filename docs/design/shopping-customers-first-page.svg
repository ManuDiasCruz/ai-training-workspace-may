<svg width="1440" height="1050" viewBox="0 0 1440 1050" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Shopping Customers API first-page dashboard prototype</title>
  <desc id="desc">Developer-ready first-page dashboard concept for the Shopping Customers API. Stakeholder: Mary.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
