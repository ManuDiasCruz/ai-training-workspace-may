      .label { fill: #475467; font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .metric { fill: #111827; font-family: Inter, Arial, sans-serif; font-size: 31px; font-weight: 800; }
      .mono { fill: #344054; font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; font-weight: 600; }
