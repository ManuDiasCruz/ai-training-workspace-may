      .surface-soft { fill: #F8FAFC; }
      .border { stroke: #DDE3EA; stroke-width: 1; }
      .primary { fill: #0F766E; }
      .primary-dark { fill: #0B5E58; }
      .accent { fill: #D97706; }
      .success { fill: #15803D; }
      .danger { fill: #B42318; }
