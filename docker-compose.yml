# One-command deployment for the full stack: PostgreSQL + API + web client.
#
#   docker compose up --build
#
# Then open http://localhost:3000 (the API is on http://localhost:5000).
#
# Override any value with a root-level .env file (see .env.example).

services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-singmeasong}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./back-end
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-singmeasong}?schema=public
      PORT: 5000
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./front-end
      args:
        # Baked into the static bundle; must be reachable from the user's
        # browser, hence localhost rather than the internal service name.
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data:
