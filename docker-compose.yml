services:
  postgres:
    image: postgres:14-alpine
    container_name: sing-me-a-song-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sing_me_a_song
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sing_me_a_song"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
