services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-singme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-singme}
      POSTGRES_DB: ${POSTGRES_DB:-singmeasong}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-singme} -d ${POSTGRES_DB:-singmeasong}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./back-end
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-singme}:${POSTGRES_PASSWORD:-singme}@db:5432/${POSTGRES_DB:-singmeasong}?schema=public
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./front-end
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db-data:
