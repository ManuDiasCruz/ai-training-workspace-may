# Full local stack: PostgreSQL + API + static front-end.
# Usage:  docker compose up --build
# Then open http://localhost:3000  (API is on http://localhost:5000)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: singmeasong
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d singmeasong"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./back-end
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/singmeasong?schema=public"
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./front-end
      args:
        # Baked into the static bundle — the browser calls the host-published API.
        REACT_APP_API_BASE_URL: "http://localhost:5000"
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
