services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sing_me_a_song
    ports:
      - "5432:5432"
    volumes:
      - sing_me_a_song_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sing_me_a_song"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sing_me_a_song_data:
