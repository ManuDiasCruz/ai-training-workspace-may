name: sing-me-a-song

services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sing_me_a_song}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sing_me_a_song}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./back-end
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sing_me_a_song}?schema=public
      PORT: "5000"
      # Set MODE=TEST to expose the /tests/reset helper (used by e2e tests).
      MODE: ${MODE:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-5060}:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./front-end
      args:
        # Empty => SPA uses same-origin requests, proxied to the back-end by nginx.
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    restart: unless-stopped

volumes:
  pgdata:
