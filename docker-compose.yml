# Local PostgreSQL for development and for the test database.
#
#   docker compose up -d
#
# Both databases are created on first boot, so back-end/.env and
# back-end/.env.test can point at singmeasong and singmeasong_test
# respectively without any further setup.
services:
  postgres:
    image: postgres:14-alpine
    container_name: singmeasong-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: singmeasong
    ports:
      - "5432:5432"
    volumes:
      - singmeasong-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  singmeasong-pgdata:
