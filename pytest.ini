[pytest]
# rootdir is the repo root, so `app` and `scripts` import without installation.
testpaths = tests
# --basetemp keeps throwaway databases inside the project instead of the system
# temp directory, so the suite runs unchanged where TEMP is locked down (CI
# containers, hardened workstations). The directory is gitignored.
addopts = -q --strict-markers --basetemp=.pytest_tmp
filterwarnings =
    error::DeprecationWarning
