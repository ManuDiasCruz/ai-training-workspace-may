[project]
name = "shopping-api"
version = "1.0.0"
description = "A small REST API over the mall-customers shopping dataset."
requires-python = ">=3.10"

[tool.pytest.ini_options]
# Ensure the project root is importable so `import app` works from anywhere.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
