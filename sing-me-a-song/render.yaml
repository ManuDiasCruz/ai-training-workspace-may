services:
  - type: web
    name: beeh-sing-me-a-song
    runtime: node
    plan: free
    branch: 0827-beeh-singasong
    rootDir: sing-me-a-song
    buildCommand: npm run setup && npm run build
    startCommand: npm run start:deploy
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      - key: CYPRESS_INSTALL_BINARY
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: beeh-sing-me-a-song-db
          property: connectionString
databases:
  - name: beeh-sing-me-a-song-db
    plan: free
    databaseName: sing_me_a_song
    postgresMajorVersion: "16"
    ipAllowList: []
