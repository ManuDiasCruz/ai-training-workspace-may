services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sing_me_a_song
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - song-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sing_me_a_song"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  song-db:
